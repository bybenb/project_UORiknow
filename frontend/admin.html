<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UORiknow · Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container py-5">

        <!-- ECRÃ DE LOGIN -->
        <div id="login-screen" class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
            <div class="admin-card" style="width:380px;">
                <h3 class="text-center mb-3">Admin</h3>
                <p class="text-secondary text-center small mb-4">Introduz o teu nome de utilizador</p>
                <input id="login-user" class="form-control mb-2" placeholder="Ex: thanos">
                <button id="login-btn" class="btn btn-success w-100">Entrar</button>
                <div id="login-err" class="text-danger small mt-2 text-center"></div>
                <a href="index.html" class="d-block text-center text-secondary small mt-3 text-decoration-none">← Voltar ao site</a>
            </div>
        </div>

        <!-- PAINEL ADMIN -->
        <div id="admin-panel" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="logo-text">UORiknow <span class="text-success">· Admin</span></h1>
                <div>
                    <span class="text-secondary me-3"><i class="fa-solid fa-user-shield"></i> <span id="who"></span></span>
                    <button id="logout-btn" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
                </div>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-disc">Disciplinas</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-lesson">Aulas</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-quest">Questões</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-disc">
                    <div class="row g-4">
                        <div class="col-md-5">
                            <div class="admin-card">
                                <h5 class="mb-3">Nova Disciplina</h5>
                                <form id="form-disc">
                                    <input class="form-control mb-2" name="name" placeholder="Nome" required>
                                    <input class="form-control mb-2" name="icon" value="fa-book">
                                    <input class="form-control mb-2" name="description" placeholder="Descrição">
                                    <button class="btn btn-success w-100">Criar</button>
                                </form>
                            </div>
                        </div>
                        <div class="col-md-7"><div class="admin-card"><h5 class="mb-3">Existentes</h5><div id="list-disc"></div></div></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab-lesson">
                    <div class="row g-4">
                        <div class="col-md-5">
                            <div class="admin-card">
                                <h5 class="mb-3">Nova Aula</h5>
                                <form id="form-lesson">
                                    <select class="form-select mb-2" name="discipline_id" id="sel-disc-lesson" required></select>
                                    <input class="form-control mb-2" name="title" placeholder="Título da aula" required>
                                    <input class="form-control mb-2" name="order" type="number" value="1">
                                    <button class="btn btn-success w-100">Criar Aula</button>
                                </form>
                            </div>
                        </div>
                        <div class="col-md-7"><div class="admin-card"><h5 class="mb-3">Aulas</h5>
                            <select class="form-select mb-3" id="filter-disc-lesson"></select>
                            <div id="list-lessons"></div>
                        </div></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab-quest">
                    <div class="row g-4">
                        <div class="col-md-5">
                            <div class="admin-card">
                                <h5 class="mb-3">Nova Questão</h5>
                                <form id="form-quest">
                                    <select class="form-select mb-2" name="lesson_id" id="sel-lesson-quest" required></select>
                                    <textarea class="form-control mb-2" name="text" placeholder="Pergunta" required></textarea>
                                    <input class="form-control mb-2" name="option_a" placeholder="A" required>
                                    <input class="form-control mb-2" name="option_b" placeholder="B" required>
                                    <input class="form-control mb-2" name="option_c" placeholder="C" required>
                                    <input class="form-control mb-2" name="option_d" placeholder="D" required>
                                    <select class="form-select mb-2" name="correct_option" required>
                                        <option>A</option><option>B</option><option>C</option><option>D</option>
                                    </select>
                                    <textarea class="form-control mb-2" name="explanation" placeholder="Explicação" required></textarea>
                                    <button class="btn btn-success w-100">Criar</button>
                                </form>
                            </div>
                        </div>
                        <div class="col-md-7"><div class="admin-card"><h5 class="mb-3">Questões</h5>
                            <select class="form-select mb-3" id="filter-lesson-quest"></select>
                            <div id="list-quests"></div>
                        </div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
