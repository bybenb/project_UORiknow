<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UORiknow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="makeup.css">
</head>
<body>
    <div id="app" class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div id="screen-subjects" class="w-100 fade-in">
            <div class="text-center mb-5">
                <h1 class="logo-text">UORiknow <span class="text-success">.</span></h1>
                <p class="text-secondary">Olá, Estudante. O que vamos dominar hoje?</p>
            </div>
            <div class="row g-4 justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card subject-card active" onclick="startQuiz('direito')">
                        <div class="card-body text-center">
                            <div class="icon-box mb-3">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <h5 class="card-title">Direito Informático</h5>
                            <p class="card-text text-secondary small">Questões Dinâmicas</p>
                            <button class="btn btn-success w-100 mt-3">Estudar Agora</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-quiz" class="w-100 d-none">
            <div class="quiz-container mx-auto">
                <div class="d-flex justify-content-between align-items-center mb-4 text-secondary">
                    <button class="btn btn-link text-white text-decoration-none" onclick="goHome()">
                        <i class="fa-solid fa-chevron-left"></i> Voltar
                    </button>
                    <span id="question-counter">Carregando...</span>
                    <i class="fa-regular fa-lightbulb"></i>
                </div>
                <div class="progress mb-4" style="height: 6px;">
                    <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
                </div>
                <h3 id="question-text" class="mb-4">Carregando pergunta...</h3>
                <div id="options-container" class="d-grid gap-3"></div>
                <div id="feedback-area" class="mt-4 d-none">
                    <div id="feedback-message" class="p-3 rounded mb-3"></div>
                    <button class="btn btn-outline-light w-100 py-3 rounded-pill" onclick="nextQuestion()">Seguinte <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
